apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: demo-apikeys
spec:
  claims:
    subjectId: "hello"
    tenantId: "acme"
  # The client sends "X-Api-Key: sl_demo_hello.world": key id, a dot, then the secret.
  apiKeys:
    - id: "sl_demo_hello"
      hashRef: "secret://env/SLUICE_APIKEY_HELLO_HASH"
      groups: ["analytics"]
