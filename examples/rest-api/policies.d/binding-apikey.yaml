# The demo key is "sl_demo_alice.world": key id "sl_demo_alice", secret "world".
apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: analysts
spec:
  claims:
    subjectId: "alice"
  apiKeys:
    - id: "sl_demo_alice"
      hashRef: "secret://env/SLUICE_APIKEY_ALICE_HASH"
      groups: ["analysts"]
