# The identity of the agent. The agent presents the API key "mcp.supersecret":
# as the X-Api-Key header over HTTP, or as --api-key for `sluice mcp` (stdio).
# The part before the last "." is the key id, the rest is the secret.
#
# Demo values. Do not use them in production. To compute the hash:
#   sluice apikey hash --pepper mcp-agent-demo-pepper --id mcp --material supersecret
apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: mcp-local
spec:
  claims:
    subjectId: "mcp-agent"
  apiKeys:
    - id: "mcp"
      hashRef: "secret://env/SLUICE_APIKEY_MCP_HASH"
      groups: ["agents"]
