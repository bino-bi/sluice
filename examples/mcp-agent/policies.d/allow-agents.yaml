# Agents may read the products table. Everything else is denied by default,
# also the customers table in the same catalog.
apiVersion: sluice.bino.bi/v1alpha1
kind: SqlAccessPolicy
metadata:
  name: allow-agents
  priority: 100
spec:
  effect: allow
  match:
    any:
      - subjects:
          groups: ["agents"]
        resources:
          catalogs: ["shop"]
          schemas: ["main"]
          tables: ["products"]
