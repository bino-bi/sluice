# Row limit for agents. A query without LIMIT gets one, a larger LIMIT is cut.
# The value is small so the demo data shows the effect.
apiVersion: sluice.bino.bi/v1alpha1
kind: QueryRewritePolicy
metadata:
  name: limit-agents
  priority: 100
spec:
  match:
    any:
      - subjects:
          groups: ["agents"]
  rewrite:
    limit:
      max: 3
