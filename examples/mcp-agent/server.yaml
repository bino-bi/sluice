# Sluice server configuration for the mcp-agent example.

rest:
  listen: ":8080"
  maxBodyBytes: 1048576
  requestTimeout: 30s

# --8<-- [start:mcp]
# MCP over HTTP on its own port. Every request must carry the agent's API key.
# `sluice mcp` also reads this file, but takes the transport from its own flag.
mcp:
  enabled: true
  transport: "streamable_http"
  listen: ":8081"
  sessionIdleMax: 30m
# --8<-- [end:mcp]

admin:
  enabled: false

duckdb:
  memoryLimit: "512MB"
  threads: 2
  maxOpen: 4
  maxIdle: 2

datasources:
  failFast: true

policies:
  directory: "./policies.d"
  reload: true

audit:
  file:
    path: "./data/audit"
    rotateDaily: true
    rotateSizeMB: 64
    genesis: "secret://env/SLUICE_AUDIT_GENESIS"

identity:
  # HMAC pepper for API keys. serve.sh sets the demo value.
  apiKeyPepper: "secret://env/SLUICE_APIKEY_PEPPER"

logging:
  level: "info"
  format: "json"

limits:
  maxRows: 1000
  maxSqlBytes: 65536
  queryTimeout: 15s
  maxConcurrent: 8
