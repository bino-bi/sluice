rest:
  listen: ":8080"

# --8<-- [start:admin]
admin:
  enabled: true
  listen: ":9091"
  # The variable SLUICE_ADMIN__TOKEN sets the token.
# --8<-- [end:admin]

policies:
  directory: "./policies.d"

# --8<-- [start:secrets]
identity:
  apiKeyPepper: "secret://file//etc/sluice/secrets/apikey-pepper"

audit:
  file:
    path: "./data/audit"
    genesis: "secret://env/SLUICE_AUDIT_GENESIS"
# --8<-- [end:secrets]
