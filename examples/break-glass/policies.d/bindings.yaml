apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: break-glass-analyst
spec:
  claims:
    subjectId: "day-to-day-analyst"
  apiKeys:
    - id: "sl_demo_analyst"
      hashRef: "secret://env/SLUICE_APIKEY_ANALYST_HASH"
      groups: ["analytics"]
---
# --8<-- [start:sre]
apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: break-glass-sre
spec:
  claims:
    subjectId: "on-call-sre"
  apiKeys:
    - id: "sl_demo_sre"
      hashRef: "secret://env/SLUICE_APIKEY_SRE_HASH"
      # The sre group lifts the email mask.
      groups: ["analytics", "sre"]
# --8<-- [end:sre]
