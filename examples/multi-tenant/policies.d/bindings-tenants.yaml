# One binding per tenant. The tenantId claim feeds the row filter.
apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: tenant-acme
spec:
  claims:
    subjectId: "acme-analyst"
    tenantId: "acme"
  apiKeys:
    - id: "sl_demo_acme"
      hashRef: "secret://env/SLUICE_APIKEY_ACME_HASH"
      groups: ["analytics"]
---
apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: tenant-beta
spec:
  claims:
    subjectId: "beta-analyst"
    tenantId: "beta"
  apiKeys:
    - id: "sl_demo_beta"
      hashRef: "secret://env/SLUICE_APIKEY_BETA_HASH"
      groups: ["analytics"]
