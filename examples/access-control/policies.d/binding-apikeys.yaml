apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: demo-keys
spec:
  apiKeys:
    - id: "sl_demo_analyst"
      hashRef: "secret://env/SLUICE_APIKEY_ANALYST_HASH"
      groups: ["analysts"]
    - id: "sl_demo_admin"
      hashRef: "secret://env/SLUICE_APIKEY_ADMIN_HASH"
      groups: ["admins"]
