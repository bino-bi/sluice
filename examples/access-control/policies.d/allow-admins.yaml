apiVersion: sluice.bino.bi/v1alpha1
kind: SqlAccessPolicy
metadata:
  name: allow-admins
  priority: 100
spec:
  effect: allow
  match:
    any:
      # No catalogs, schemas or tables: the clause matches every table.
      - subjects:
          groups: ["admins"]
        resources:
          actions: ["SELECT"]
