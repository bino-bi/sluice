apiVersion: sluice.bino.bi/v1alpha1
kind: ColumnMaskPolicy
metadata:
  name: mask-ssn
  priority: 100
spec:
  match:
    any:
      - resources:
          catalogs: ["shop"]
          schemas: ["main"]
          tables: ["customers"]
          columns: ["ssn"]
  # --8<-- [start:mask]
  mask:
    type: "constant"
    args:
      value: "REDACTED"
  # --8<-- [end:mask]
