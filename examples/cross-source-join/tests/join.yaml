# The runner has no data source. A masked table needs its columns here.
schema:
  shop.main.orders: [id, customer_id, country_code, amount_cents]

cases:
  - name: analyst joins both catalogs, the mask stays on the orders side
    identity: { subject: analyst, groups: [analytics] }
    sql: >-
      SELECT o.id, o.customer_id, c.name AS country
      FROM shop.main.orders o JOIN ref.main.countries c ON c.code = o.country_code
    expect:
      outcome: allow
      applied: ["ColumnMaskPolicy/mask-customer-id", "SqlAccessPolicy/allow-analytics"]
      masks: ["shop.main.orders.customer_id=null"]
      rewrittenSql: >-
        SELECT o.id, o.customer_id, c.name AS country
        FROM (SELECT sluice_src.id, NULL AS customer_id, sluice_src.country_code, sluice_src.amount_cents
              FROM shop.main.orders sluice_src) o
        JOIN ref.main.countries c ON c.code = o.country_code

  - name: intern is denied the same join, orders is not allowed
    identity: { subject: intern, groups: [reference] }
    sql: >-
      SELECT o.id, o.customer_id, c.name AS country
      FROM shop.main.orders o JOIN ref.main.countries c ON c.code = o.country_code
    expect:
      outcome: deny

  - name: intern reads the reference table alone
    identity: { subject: intern, groups: [reference] }
    sql: "SELECT code, name FROM ref.main.countries"
    expect:
      outcome: allow
      applied: ["SqlAccessPolicy/allow-reference"]
      rewrittenSql: "SELECT code, name FROM ref.main.countries"
