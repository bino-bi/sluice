rest:
  listen: ":8080"

# --8<-- [start:admin]
admin:
  enabled: true
  listen: ":9091"
  # The variable SLUICE_ADMIN__TOKEN sets the token.
  tls:
    certFile: "./data/tls/server.crt"
    keyFile: "./data/tls/server.key"
# --8<-- [end:admin]

policies:
  directory: "./policies.d"

audit:
  file:
    path: "./data/audit"
    genesis: "secret://env/SLUICE_AUDIT_GENESIS"
