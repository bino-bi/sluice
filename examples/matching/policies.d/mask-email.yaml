apiVersion: sluice.bino.bi/v1alpha1
kind: ColumnMaskPolicy
metadata:
  name: mask-email
  priority: 50
spec:
  match:
    any:
      - resources:
          catalogs: ["shop"]
          schemas: ["crm"]
          columns: ["email"]
  exclude:
    any:
      - subjects:
          groups: ["sre"]
  mask:
    type: hash
