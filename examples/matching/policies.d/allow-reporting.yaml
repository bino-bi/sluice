apiVersion: sluice.bino.bi/v1alpha1
kind: SqlAccessPolicy
metadata:
  name: allow-reporting
  priority: 100
spec:
  effect: allow
  match:
    any:
      - subjects:
          groups: ["analysts"]
        resources:
          catalogs: ["shop"]
          schemas: ["main"]
          tables: ["orders"]
      - subjects:
          groups: ["support"]
        resources:
          catalogs: ["shop"]
          schemas: ["main"]
          tables: ["tickets"]
