apiVersion: sluice.bino.bi/v1alpha1
kind: SqlAccessPolicy
metadata:
  name: allow-crm
  priority: 100
spec:
  effect: allow
  match:
    any:
      - subjects:
          groups: ["analysts", "sre"]
        resources:
          catalogs: ["shop"]
          schemas: ["crm", "billing"]
