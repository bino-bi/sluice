apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: acme-analyst
spec:
  claims:
    subjectId: "acme-analyst"
    tenantId: "acme"
  apiKeys:
    - id: "sl_demo_acme"
      hashRef: "secret://env/SLUICE_APIKEY_ACME_HASH"
      groups: ["analysts"]
---
apiVersion: sluice.bino.bi/v1alpha1
kind: SubjectBinding
metadata:
  name: guest
spec:
  claims:
    subjectId: "guest"
  apiKeys:
    - id: "sl_demo_guest"
      hashRef: "secret://env/SLUICE_APIKEY_GUEST_HASH"
      groups: ["guests"]
