apiVersion: sluice.bino.bi/v1alpha1
kind: SqlAccessPolicy
metadata:
  name: allow-all
  priority: 0
spec:
  effect: allow
  match:
    any:
      - resources:
          tables: ["*"]
---
apiVersion: sluice.bino.bi/v1alpha1
kind: RowFilterPolicy
metadata:
  name: hide-void
  priority: 50
spec:
  match:
    any:
      - resources:
          tables: ["orders"]
  filter:
    predicate:
      column: status
      op: NotEquals
      value: "void"
---
apiVersion: sluice.bino.bi/v1alpha1
kind: ColumnMaskPolicy
metadata:
  name: mask-status
  priority: 50
spec:
  match:
    any:
      - resources:
          tables: ["orders"]
          columns: ["status"]
  mask:
    type: partial
    args:
      showFirst: 1
