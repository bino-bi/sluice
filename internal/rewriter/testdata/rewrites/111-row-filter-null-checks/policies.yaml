apiVersion: sluice.bino.bi/v1alpha1
kind: SqlAccessPolicy
metadata:
  name: allow-all
  priority: 0
spec:
  effect: allow
  match:
    any:
      - resources:
          tables: ["*"]
---
apiVersion: sluice.bino.bi/v1alpha1
kind: RowFilterPolicy
metadata:
  name: null-checks
  priority: 50
spec:
  match:
    any:
      - resources:
          tables: ["products"]
  filter:
    predicate:
      all:
        - column: deleted_at
          op: IsNull
        - column: sku
          op: IsNotNull
        - not:
            column: region
            op: IsNull
