# SPDX-License-Identifier: AGPL-3.0-or-later
# goreleaser v2 configuration — https://goreleaser.com
#
# Multi-arch release: linux/darwin amd64+arm64, windows amd64. CGO on because
# pg_query_go and go-duckdb both require it. Cross-compilation uses the
# ghcr.io/goreleaser/goreleaser-cross image (release.yaml pins the version) so
# all five platforms build in one container without a host-side toolchain dance.
# linux/amd64 is built separately (sluice-static) against a custom DuckDB
# bundle with the httpfs/excel/scanner extensions compiled in; the release
# workflow provides it via LIBDUCKDB_DIR (see scripts/build-libduckdb.sh).
#
# Per plan/25-release.md (Slice 10): docker manifest lists, cosign keyless
# signatures, syft SBOM (CycloneDX), SLSA provenance via the release workflow.

version: 2

project_name: sluice

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  # Prebuilt-binding platforms: DuckDB core + default extensions are
  # statically linked, httpfs/excel/scanners install at first attach.
  - id: sluice-cgo
    main: ./cmd/sluice
    binary: sluice
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Os "linux" }}{{- if eq .Arch "arm64" }}CC=aarch64-linux-gnu-gcc{{ end }}{{- end }}
      - >-
        {{- if eq .Os "darwin" }}{{- if eq .Arch "amd64" }}CC=o64-clang{{ end }}{{- if eq .Arch "arm64" }}CC=oa64-clang{{ end }}{{- end }}
    # windows/amd64 is not released: DuckDB's prebuilt windows-amd64
    # archives reference pthread_mutex_* but the bindings' cgo LDFLAGS
    # (-lws2_32 -lwsock32 -lrstrtmgr -lstdc++ -lm --static) never link
    # winpthreads, so the mingw cross-link fails with hundreds of
    # undefined references. Native windows `go build` works — test.yaml
    # covers it — so this is a cross-compile gap, not a code gap.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: linux
        goarch: amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/bino-bi/sluice/internal/version.Version={{.Version}}
      - -X github.com/bino-bi/sluice/internal/version.Commit={{.ShortCommit}}
      - -X github.com/bino-bi/sluice/internal/version.CommitFull={{.FullCommit}}
      - -X github.com/bino-bi/sluice/internal/version.BuildTime={{.Date}}
      - -X github.com/bino-bi/sluice/internal/version.Parser=pg_query

  # linux/amd64 links the custom DuckDB bundle with httpfs, excel, and
  # sqlite_scanner compiled in — no runtime extension downloads for
  # s3/http/sqlite sources. The release workflow builds the bundle
  # (release.yaml job `libduckdb`) and exports LIBDUCKDB_DIR before
  # goreleaser runs.
  - id: sluice-static
    main: ./cmd/sluice
    binary: sluice
    tags: [duckdb_use_static_lib]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CGO_CFLAGS=-DDUCKDB_STATIC_BUILD
      - >-
        CGO_LDFLAGS=-L{{ .Env.LIBDUCKDB_DIR }} -lduckdb_bundle -lstdc++ -lm -ldl
    goos: [linux]
    goarch: [amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/bino-bi/sluice/internal/version.Version={{.Version}}
      - -X github.com/bino-bi/sluice/internal/version.Commit={{.ShortCommit}}
      - -X github.com/bino-bi/sluice/internal/version.CommitFull={{.FullCommit}}
      - -X github.com/bino-bi/sluice/internal/version.BuildTime={{.Date}}
      - -X github.com/bino-bi/sluice/internal/version.Parser=pg_query

archives:
  - id: default
    ids: [sluice-cgo, sluice-static]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - LICENSE-APACHE
      - LICENSE-CC-BY
      - NOTICE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - THREAT_MODEL.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-dev+{{ .ShortCommit }}'

changelog:
  disable: true

dockers:
  # Both images attach datasources without runtime extension downloads:
  # amd64 has httpfs/excel/sqlite_scanner compiled in and pre-seeds the
  # rest as loadable files; arm64 (prebuilt bindings) pre-seeds all six.
  # The release workflow fetches third_party/duckdb-extensions/<arch>
  # before goreleaser runs (scripts/fetch-duckdb-extensions.sh).
  - id: sluice-amd64
    ids: [sluice-static]
    goos: linux
    goarch: amd64
    image_templates:
      - 'ghcr.io/bino-bi/sluice:{{ .Version }}-amd64'
      # `latest` tracks stable tags only — a pre-release must never become
      # the default pull. goreleaser drops templates that render empty.
      - '{{ if not .Prerelease }}ghcr.io/bino-bi/sluice:latest-amd64{{ end }}'
    dockerfile: Dockerfile.release
    extra_files:
      - third_party/duckdb-extensions/amd64
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title=sluice
      - --label=org.opencontainers.image.description=Policy-enforcing SQL/MCP gateway
      - --label=org.opencontainers.image.url=https://github.com/bino-bi/sluice
      - --label=org.opencontainers.image.source=https://github.com/bino-bi/sluice
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0-or-later

  - id: sluice-arm64
    ids: [sluice-cgo]
    goos: linux
    goarch: arm64
    image_templates:
      - 'ghcr.io/bino-bi/sluice:{{ .Version }}-arm64'
      - '{{ if not .Prerelease }}ghcr.io/bino-bi/sluice:latest-arm64{{ end }}'
    dockerfile: Dockerfile.release
    extra_files:
      - third_party/duckdb-extensions/arm64
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title=sluice
      - --label=org.opencontainers.image.description=Policy-enforcing SQL/MCP gateway
      - --label=org.opencontainers.image.url=https://github.com/bino-bi/sluice
      - --label=org.opencontainers.image.source=https://github.com/bino-bi/sluice
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0-or-later

docker_manifests:
  - name_template: 'ghcr.io/bino-bi/sluice:{{ .Version }}'
    image_templates:
      - 'ghcr.io/bino-bi/sluice:{{ .Version }}-amd64'
      - 'ghcr.io/bino-bi/sluice:{{ .Version }}-arm64'
  # Skipped entirely on pre-releases: an empty name_template makes
  # goreleaser skip the manifest instead of failing.
  - name_template: '{{ if not .Prerelease }}ghcr.io/bino-bi/sluice:latest{{ end }}'
    image_templates:
      - 'ghcr.io/bino-bi/sluice:latest-amd64'
      - 'ghcr.io/bino-bi/sluice:latest-arm64'

sboms:
  - id: default
    artifacts: archive
    documents:
      - '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.cdx.json'
    cmd: syft
    args: ['$artifact', '--output', 'cyclonedx-json=$document']

signs:
  - id: cosign
    cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum
    output: true

docker_signs:
  - id: cosign-docker
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - --yes
      - ${artifact}@${digest}
    output: true

# The release is created by a human on the GitHub Releases page (which is
# what creates the tag); publishing it triggers .github/workflows/release.yaml.
# goreleaser then adopts that existing release rather than creating one.
release:
  github:
    owner: bino-bi
    name: sluice
  # `auto` reads the tag: v0.1.0-rc.1 is flagged pre-release, v0.1.0 is not.
  # goreleaser also forces make_latest=false for pre-releases, so a candidate
  # never becomes the repo's "latest" release.
  prerelease: auto
  draft: false
  # Append our footer to the notes typed in the UI instead of overwriting
  # them (`keep-existing`, the default, would drop the footer entirely).
  mode: append
  # Makes a re-run after a partial failure idempotent instead of 422-ing on
  # the assets that already uploaded.
  replace_existing_artifacts: true
  name_template: '{{ .Tag }}'
  header: |
    See [CHANGELOG.md](https://github.com/bino-bi/sluice/blob/main/CHANGELOG.md) for the full list of changes.
  footer: |
    ---
    Verify artefact signatures with cosign:

    ```
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/bino-bi/sluice/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```
